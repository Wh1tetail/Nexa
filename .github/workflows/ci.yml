name: CI

on:
  push:
    branches: ["**"]   # every branch is checked before it reaches main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexa_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/nexa_ci
      # Throwaway key for the CI database only
      SECRET_KEY: ci-only-not-a-real-secret-key-0123456789abcdef
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Create test database (tests use <DATABASE_URL>_test)
        run: python -c "import psycopg; c = psycopg.connect('postgresql://postgres:postgres@localhost:5432/postgres', autocommit=True); c.execute('CREATE DATABASE nexa_ci_test')"
      - name: Lint
        run: python -m pyflakes app tests scripts
      - name: Migrations round-trip
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Tests
        run: python -m pytest -q

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc -b --noEmit
      - name: Build
        run: npm run build

  docker:
    name: Docker stack (build and smoke test)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Create .env with throwaway secrets
        run: |
          cp .env.production.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$(openssl rand -hex 32)|" .env
      - name: Check the HTTPS configuration (Caddy)
        run: |
          DOMAIN=nexa.example.com docker compose --profile https config --quiet
          docker run --rm -e DOMAIN=nexa.example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke test through nginx
        run: |
          set -eu
          # name the failing check in an annotation (readable without signing in)
          trap 'echo "::error title=Smoke test::line $LINENO: $BASH_COMMAND"' ERR
          base=http://localhost:8080
          curl -fsS "$base/api/health" | grep -q '"ok"'
          curl -fsS "$base/" | grep -q "NEXA"
          # SPA route falls back to index.html
          curl -fsS "$base/teacher/lessons" | grep -q '<div id="root">'
          # API error comes back as JSON from the backend, not an nginx page
          code=$(curl -s -o /tmp/login.json -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"email":"nobody@nexa.school","password":"wrong-pass-1"}' "$base/api/v1/auth/login")
          test "$code" = "401" && grep -q detail /tmp/login.json
          # Demo data, then a real sign-in
          docker compose exec -T backend python -m scripts.seed
          token=$(curl -fsS -H 'Content-Type: application/json' \
            -d '{"email":"anna@nexa.school","password":"Demo12345"}' "$base/api/v1/auth/login" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['access_token'])")
          curl -fsS -H "Authorization: Bearer $token" "$base/api/v1/dashboard/student" | grep -q full_name
          # Server-Sent Events must stream through nginx without buffering
          curl -sN -m 5 -H "Authorization: Bearer $token" "$base/api/v1/notifications/stream" > /tmp/sse.txt || true
          grep -q "event: ready" /tmp/sse.txt
          # First administrator on a fresh server
          docker compose exec -T -e NEXA_ADMIN_PASSWORD=Admin12345 backend \
            python -m scripts.create_admin --email owner@example.com --name "Owner"
          curl -fsS -H 'Content-Type: application/json' \
            -d '{"email":"owner@example.com","password":"Admin12345"}' "$base/api/v1/auth/login" | grep -q access_token
          # The backup service writes a database dump and a files archive
          for i in $(seq 1 30); do ls backups/db-*.dump >/dev/null 2>&1 && break; sleep 2; done
          ls -l backups
          ls backups/db-*.dump backups/files-*.tar.gz
          # (to a file first: with pipefail, grep -q stopping early would fail the pipe)
          docker compose exec -T db pg_restore --list < "$(ls backups/db-*.dump | head -1)" > /tmp/toc.txt
          grep -q "TABLE public users" /tmp/toc.txt
          echo "Smoke test passed"
      - name: Logs on failure
        if: failure()
        run: |
          docker compose ps -a
          ls -la backups || true
          for s in backend web backup; do
            echo "::error title=$s logs::$(docker compose logs --no-color --tail 25 $s 2>&1 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          done
          docker compose logs --no-color --tail 200
      - name: Stop
        if: always()
        run: docker compose down -v
